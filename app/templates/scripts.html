{% extends "base.html" %}
{% block content %}
<div class="p-6 max-w-7xl mx-auto">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6 flex-wrap gap-2">
        <div>
            <h2 class="text-2xl font-bold text-white">📝 批量脚本工坊</h2>
            <p class="text-sm text-slate-400 mt-1">批量生成 → AI 审查 → 控制台一键使用（使用过的脚本自动标记，防重复）</p>
        </div>
        <a href="/" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm text-white">▶ 到控制台使用</a>
    </div>

    <!-- Generate panel -->
    <div class="bg-slate-800 rounded-xl border border-slate-700 mb-6">
        <button type="button" onclick="toggleGenPanel()" class="w-full flex items-center justify-between px-5 py-4 text-left">
            <span class="text-lg font-semibold text-white">✨ 批量生成脚本</span>
            <span id="gen-panel-arrow" class="text-slate-400 text-lg">▾</span>
        </button>
        <div id="gen-panel" class="px-5 pb-5 border-t border-slate-700 pt-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">大模型 Provider</label>
                    <select id="gen-provider" onchange="onProviderChange()"
                        class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white"></select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">模型</label>
                    <select id="gen-model" onchange="saveFormMemory()"
                        class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white"></select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">模式 (视频结构)</label>
                    <select id="gen-structure" onchange="onStructureChange()"
                        class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white">
                        <option value="original">Original (4章视频片段)</option>
                        <option value="original_static">Original Static (4章静态图片)</option>
                        <option value="original_cutout">Original Cutout (4章+人物抠图)</option>
                        <option value="quest">Quest (任务听力 · 单个约5-10分钟)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">CEFR</label>
                    <select id="gen-cefr"
                        class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white">
                        <option>A1</option><option>A2</option><option>B1</option>
                        <option>B2</option><option>C1</option><option>C2</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">对话行数</label>
                    <input type="number" id="gen-numlines" min="4" max="80" placeholder="留空=默认 (18 / quest 48)"
                        class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-600">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">🎲 随机抽取未用主题</label>                    <div class="flex gap-2">
                        <select id="random-count"
                            class="w-20 bg-slate-900 border border-slate-600 rounded-lg px-2 py-2 text-sm text-white">
                            <option>1</option><option>2</option><option>3</option>
                            <option>5</option><option selected>10</option>
                        </select>
                        <button type="button" onclick="randomPick()"
                            class="flex-1 px-3 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm text-slate-200">🎲 抽取</button>
                    </div>
                </div>
            </div>

            <!-- Topic picker -->
            <div class="mb-4">
                <div class="flex items-center justify-between mb-1 gap-2 flex-wrap">
                    <label class="text-xs text-slate-400">从主题库选择（可多选，<span class="line-through text-slate-500">划线</span>=已用主题）</label>
                    <div class="flex gap-2 items-center">
                        <input type="text" id="topic-search" oninput="renderTopicList()" placeholder="🔍 搜索主题..."
                            class="bg-slate-900 border border-slate-600 rounded-lg px-3 py-1.5 text-xs text-white w-48">
                        <button type="button" onclick="clearSelectedTopics()" class="text-xs text-slate-400 hover:text-slate-200">清空已选</button>
                    </div>
                </div>
                <div id="topic-list" class="max-h-56 overflow-y-auto grid grid-cols-1 md:grid-cols-3 gap-1 border border-slate-700 rounded-lg p-2 bg-slate-900"></div>
                <div id="selected-topics" class="flex flex-wrap gap-1.5 mt-2"></div>
                <textarea id="custom-topics" rows="2" placeholder="或自定义主题，每行一个（与上方勾选合并，共 N 个脚本）"
                    class="w-full mt-2 bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-600"></textarea>
            </div>

            <div class="flex flex-wrap gap-2 items-center">
                <button type="button" id="btn-generate" onclick="startGenerate()"
                    class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-white font-medium text-sm">▶ 开始批量生成</button>
                <button type="button" id="btn-gen-stop" onclick="stopGenerate()" style="display:none"
                    class="px-5 py-2.5 bg-red-600 hover:bg-red-500 rounded-lg text-white font-medium text-sm">⏹ 停止</button>
                <span class="text-xs text-slate-500">串行执行，LLM 限流自动等待 · 完成的脚本立即入库可审查/使用</span>
            </div>
            <div id="gen-status" class="hidden mt-3 text-sm text-indigo-300"></div>
            <div id="gen-log" class="hidden mt-2 font-mono text-xs bg-slate-950 rounded-lg p-3 h-44 overflow-y-auto text-slate-300 whitespace-pre-wrap"></div>
        </div>
    </div>

    <!-- Toolbar -->
    <div class="flex items-center justify-between mb-4 gap-3 flex-wrap">
        <div class="flex gap-2 items-center flex-wrap">
            <select id="filter-structure" onchange="loadScripts()"
                class="bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white">
                <option value="">全部结构</option>
                <option value="original">Original</option>
                <option value="original_static">Original Static</option>
                <option value="original_cutout">Original Cutout</option>
                <option value="quest">Quest</option>
            </select>
            <select id="filter-status" onchange="loadScripts()"
                class="bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white">
                <option value="">全部状态</option>
                <option value="unused">未使用</option>
                <option value="draft">草稿</option>
                <option value="reviewed">已审查</option>
                <option value="used">已使用</option>
            </select>
            <input type="text" id="filter-q" oninput="debounceLoadScripts()" placeholder="搜索 topic / 标题..."
                class="bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white w-52">
        </div>
        <div class="flex gap-2">
            <button type="button" id="btn-review-all" onclick="reviewAll()"
                class="px-4 py-2 bg-amber-600 hover:bg-amber-500 rounded-lg text-sm text-white font-medium">🔍 批量审查未审查（全库）</button>
            <button type="button" onclick="loadScripts()"
                class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm text-slate-300">🔄 刷新</button>
        </div>
    </div>
    <div id="review-progress" class="hidden mb-4 bg-slate-800 border border-amber-700/50 rounded-lg px-4 py-3 text-sm text-amber-300"></div>

    <!-- Script list -->
    <div id="script-list" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
</div>

<!-- Editor modal -->
<div id="editor-modal" class="fixed inset-0 bg-black/70 z-50 hidden items-center justify-center p-4" onclick="closeEditor(event)">
    <div class="bg-slate-800 border border-slate-600 rounded-xl w-full max-w-5xl max-h-[90vh] flex flex-col" onclick="event.stopPropagation()">
        <div class="flex items-center justify-between px-5 py-4 border-b border-slate-700">
            <h3 class="text-lg font-bold text-white" id="ed-title">脚本编辑</h3>
            <div class="flex gap-2">
                <button type="button" onclick="saveEditor()" id="ed-save"
                    class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm text-white font-medium">💾 保存</button>
                <button type="button" onclick="closeEditor()" class="text-slate-400 hover:text-white text-xl px-2">✕</button>
            </div>
        </div>
        <div id="ed-body" class="overflow-y-auto p-5 space-y-4"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// =========================================================================
// 表单数据 + Provider/Model 联动
// =========================================================================
let FORM = null;
let SCRIPTS = [];
let _selectedTopics = new Set();
let _editingDoc = null;
let _sseBusy = false;

const STRUCT_LABEL = {original: 'Original', original_static: 'Original Static', original_cutout: 'Original Cutout', quest: 'Quest'};
const STATUS_BADGE = {
    draft:   ['草稿', 'bg-slate-600 text-white'],
    reviewed:['已审查', 'bg-blue-600 text-white'],
    used:    ['✓ 已使用', 'bg-green-600 text-white'],
};

function escapeHtml(s) {
    if (s === null || s === undefined) return '';
    const div = document.createElement('div');
    div.textContent = String(s);
    return div.innerHTML;
}

function fmtDate(ts) {
    if (!ts) return '';
    const d = new Date(ts * 1000);
    const now = Date.now();
    const diff = (now - ts * 1000) / 1000;
    if (diff < 3600) return Math.max(1, Math.floor(diff / 60)) + '分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
    if (diff < 604800) return Math.floor(diff / 86400) + '天前';
    return `${d.getMonth() + 1}-${d.getDate()}`;
}

function loadFormOptions() {
    fetch('/api/scripts/form_options')
        .then(r => r.json())
        .then(data => {
            FORM = data;
            renderProviderSelect();
            renderTopicList();
            if (data.current) {
                if (data.current.cefr) document.getElementById('gen-cefr').value = data.current.cefr;
            }
        });
}

function renderProviderSelect() {
    const sel = document.getElementById('gen-provider');
    // 上次使用的优先；无记录时回退到当前配置
    const lastP = FORM.last && FORM.last.provider;
    const cur = (lastP && (lastP in (FORM.providers || {}))) ? lastP
        : (FORM.current ? FORM.current.provider : '');
    sel.innerHTML = '';
    Object.entries(FORM.providers || {}).forEach(([value, label]) => {
        const opt = document.createElement('option');
        opt.value = value;
        opt.textContent = label;
        sel.appendChild(opt);
    });
    if (cur && (cur in (FORM.providers || {}))) sel.value = cur;
    onProviderChange(true);
}

// 记住本次选择的 Provider/模型（下次进入页面自动回显）
function saveFormMemory() {
    if (!FORM) return;
    fetch('/api/scripts/form_memory', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            provider: document.getElementById('gen-provider').value,
            model: document.getElementById('gen-model').value,
        })
    }).catch(() => {});
}

function onProviderChange(skipSave) {
    const provider = document.getElementById('gen-provider').value;
    const sel = document.getElementById('gen-model');
    sel.innerHTML = '';
    let models = [];
    if (provider === 'sensenova') {
        models = FORM.sensenova_models || [];
    } else if (provider.startsWith('custom:')) {
        const cp = (FORM.custom_providers || []).find(p => 'custom:' + p.id === provider);
        models = cp ? cp.models : [];
    } else {
        models = FORM.openai_models || [];
    }
    models.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m; opt.textContent = m;
        sel.appendChild(opt);
    });
    // 上次使用的模型优先，其次当前配置的模型
    const lastM = FORM.last && FORM.last.model;
    if (lastM && models.includes(lastM)) {
        sel.value = lastM;
    } else if (FORM.current) {
        const saved = provider === 'sensenova' ? FORM.current.sensenova_model : FORM.current.openai_model;
        if (saved && models.includes(saved)) sel.value = saved;
    }
    if (!skipSave) saveFormMemory();
}

function onStructureChange() {
    const s = document.getElementById('gen-structure').value;
    const input = document.getElementById('gen-numlines');
    input.placeholder = `留空=默认 (${FORM && FORM.default_lines ? (FORM.default_lines[s] || 18) : 18})`;
    renderTopicList();  // 已用主题按模式独立划分线
}

// 当前所选模式已用的主题集合（各模式独立记录）
function usedTopicsForCurrentMode() {
    if (!FORM) return new Set();
    return new Set((FORM.used_by_mode || {})[document.getElementById('gen-structure').value] || []);
}

// 当前所选模式下「库中已有脚本」的主题集合（任意状态，防重复生成提示用）
function libraryTopicsForCurrentMode() {
    if (!FORM) return new Set();
    return new Set((FORM.library_topics || {})[document.getElementById('gen-structure').value] || []);
}

function toggleGenPanel() {
    const panel = document.getElementById('gen-panel');
    const arrow = document.getElementById('gen-panel-arrow');
    const hidden = panel.style.display === 'none';
    panel.style.display = hidden ? '' : 'none';
    arrow.textContent = hidden ? '▾' : '▸';
}

// =========================================================================
// 主题选择
// =========================================================================

function renderTopicList() {
    const container = document.getElementById('topic-list');
    if (!FORM) { container.innerHTML = ''; return; }
    const needle = (document.getElementById('topic-search').value || '').toLowerCase();
    let html = '';
    const usedSet = usedTopicsForCurrentMode();
    const libSet = libraryTopicsForCurrentMode();
    Object.entries(FORM.topics_data || {}).forEach(([cat, topics]) => {
        const hits = topics.filter(t => !needle || t.toLowerCase().includes(needle));
        if (!hits.length) return;
        html += `<div class="col-span-full text-[11px] text-slate-500 mt-1">${escapeHtml(cat)}</div>`;
        hits.forEach(t => {
            const used = usedSet.has(t);
            const inLib = libSet.has(t);
            const checked = _selectedTopics.has(t);
            const tip = used ? '已用于该模式的 run' : (inLib ? '库中已有该主题的脚本' : '');
            html += `
                <label class="flex items-center gap-1.5 text-xs px-2 py-1 rounded hover:bg-slate-800 cursor-pointer ${used ? 'opacity-50' : ''}" ${tip ? `title="${tip}"` : ''}>
                    <input type="checkbox" ${checked ? 'checked' : ''} ${used ? 'disabled' : ''}
                        onchange="toggleTopic('${escapeHtml(t).replace(/'/g, '&#39;')}', this.checked)"
                        class="accent-indigo-500 w-3.5 h-3.5">
                    <span class="${used ? 'line-through text-slate-500' : 'text-slate-300'} truncate">${inLib && !used ? '📄 ' : ''}${escapeHtml(t)}</span>
                </label>`;
        });
    });
    container.innerHTML = html || '<p class="text-xs text-slate-500 col-span-full p-2">无匹配主题</p>';
    renderSelectedChips();
}

function toggleTopic(topic, checked) {
    if (checked) _selectedTopics.add(topic);
    else _selectedTopics.delete(topic);
    renderSelectedChips();
}

function clearSelectedTopics() {
    _selectedTopics.clear();
    renderTopicList();
}

function renderSelectedChips() {
    const box = document.getElementById('selected-topics');
    if (!_selectedTopics.size) { box.innerHTML = ''; return; }
    let html = `<span class="text-xs text-slate-500 self-center">已选 ${_selectedTopics.size}:</span>`;
    _selectedTopics.forEach(t => {
        html += `<span class="inline-flex items-center gap-1 bg-indigo-900/50 border border-indigo-700 rounded-full px-2.5 py-0.5 text-xs text-indigo-200">
            ${escapeHtml(t)}
            <button type="button" onclick="toggleTopic('${escapeHtml(t).replace(/'/g, '&#39;')}', false); renderTopicList()"
                class="text-indigo-400 hover:text-white">✕</button>
        </span>`;
    });
    box.innerHTML = html;
}

function randomPick() {
    if (!FORM) return;
    const usedSet = usedTopicsForCurrentMode();
    const libSet = libraryTopicsForCurrentMode();
    const pool = [];
    Object.values(FORM.topics_data || {}).forEach(topics => {
        topics.forEach(t => {
            if (!usedSet.has(t) && !libSet.has(t) && !_selectedTopics.has(t)) pool.push(t);
        });
    });
    const n = parseInt(document.getElementById('random-count').value) || 1;
    for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    pool.slice(0, n).forEach(t => _selectedTopics.add(t));
    renderTopicList();
}

// =========================================================================
// 批量生成 (SSE)
// =========================================================================

function genLog(line, cls) {
    const log = document.getElementById('gen-log');
    log.classList.remove('hidden');
    const div = document.createElement('div');
    div.className = cls || 'text-slate-300';
    div.textContent = line;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
}

function genStatus(msg, show) {
    const el = document.getElementById('gen-status');
    if (msg !== null) el.textContent = msg;
    el.classList.toggle('hidden', show === false);
}

function collectTopics() {
    const topics = Array.from(_selectedTopics);
    const custom = (document.getElementById('custom-topics').value || '')
        .split('\n').map(t => t.trim()).filter(t => t && !topics.includes(t));
    return topics.concat(custom);
}

async function startGenerate() {
    if (_sseBusy) return;
    const topics = collectTopics();
    if (!topics.length) {
        alert('请先勾选主题、填写自定义主题，或点「🎲 抽取」随机选择');
        return;
    }
    const body = {
        provider: document.getElementById('gen-provider').value,
        model: document.getElementById('gen-model').value,
        structure: document.getElementById('gen-structure').value,
        cefr: document.getElementById('gen-cefr').value,
        num_lines: document.getElementById('gen-numlines').value || '',
        topics: topics,
        random_count: 0,
    };

    document.getElementById('btn-generate').disabled = true;
    document.getElementById('btn-gen-stop').style.display = '';
    document.getElementById('gen-log').innerHTML = '';
    genStatus('生成中...');
    _sseBusy = true;
    let generated = 0;

    try {
        const resp = await fetch('/api/scripts/generate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body),
        });
        if (!resp.ok) {
            const err = await resp.json().catch(() => ({}));
            throw new Error(err.error || `HTTP ${resp.status}`);
        }
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        while (true) {
            const {done, value} = await reader.read();
            if (done) break;
            buf += decoder.decode(value, {stream: true});
            let idx;
            while ((idx = buf.indexOf('\n\n')) >= 0) {
                const chunk = buf.slice(0, idx);
                buf = buf.slice(idx + 2);
                if (!chunk.startsWith('data: ')) continue;
                let ev;
                try { ev = JSON.parse(chunk.slice(6)); } catch (e) { continue; }
                if (ev.type === 'progress') {
                    genLog(ev.message, ev.message.startsWith('✅') ? 'text-green-400'
                        : ev.message.startsWith('❌') ? 'text-red-400'
                        : ev.message.startsWith('⏹') ? 'text-amber-400' : 'text-slate-300');
                    genStatus(ev.message);
                } else if (ev.type === 'script') {
                    generated++;
                    genLog(`  → 已入库: ${ev.data.topic} (id=${ev.data.id})`, 'text-indigo-400');
                    SCRIPTS.unshift(ev.data);
                    renderList();
                } else if (ev.type === 'error_item') {
                    genLog(`  → 失败: ${ev.data.topic}: ${ev.data.error}`, 'text-red-400');
                } else if (ev.type === 'done') {
                    genStatus(`完成: 成功 ${ev.data.generated}/${ev.data.total}` +
                        (ev.data.failed ? `，失败 ${ev.data.failed}` : '') +
                        (ev.data.stopped ? '（已停止）' : ''));
                } else if (ev.type === 'error') {
                    genLog('FATAL: ' + ev.error, 'text-red-400');
                    genStatus('生成失败: ' + ev.error, false);
                }
            }
        }
    } catch (e) {
        alert('生成失败: ' + e.message);
        genStatus(null, false);
    } finally {
        _sseBusy = false;
        document.getElementById('btn-generate').disabled = false;
        document.getElementById('btn-gen-stop').style.display = 'none';
        loadScripts();
    }
}

function stopGenerate() {
    fetch('/api/scripts/generate/stop', {method: 'POST'}).catch(() => {});
    genLog('⏹ 已请求停止（当前主题完成后中止）...', 'text-amber-400');
}

/* APPEND_JS_CORE */
// =========================================================================
// 脚本列表
// =========================================================================

let _loadTimer = null;
function debounceLoadScripts() {
    clearTimeout(_loadTimer);
    _loadTimer = setTimeout(loadScripts, 300);
}

function loadScripts() {
    const structure = document.getElementById('filter-structure').value;
    const status = document.getElementById('filter-status').value;
    const q = document.getElementById('filter-q').value.trim();
    const params = new URLSearchParams();
    if (structure) params.set('structure', structure);
    if (status) params.set('status', status);
    if (q) params.set('q', q);
    fetch('/api/scripts?' + params.toString())
        .then(r => r.json())
        .then(data => {
            SCRIPTS = data.scripts || [];
            renderList();
        });
}

function scoreBadge(meta) {
    if (meta.score === null || meta.score === undefined)
        return '<span class="px-2 py-0.5 rounded-full text-[10px] bg-slate-700 text-slate-400">未审查</span>';
    let cls = 'bg-green-700 text-green-100';
    if (meta.score < 60) cls = 'bg-red-700 text-red-100';
    else if (meta.score < 80) cls = 'bg-amber-700 text-amber-100';
    return `<span class="px-2 py-0.5 rounded-full text-[10px] ${cls}">★ ${meta.score}</span>`;
}

function genderBadge(g, label) {
    if (!g) return '';
    if (g === 'female')
        return `<span class="px-2 py-0.5 rounded-full text-[10px] bg-pink-900/60 text-pink-300" title="角色${label}性别：女">♀ ${label}</span>`;
    if (g === 'male')
        return `<span class="px-2 py-0.5 rounded-full text-[10px] bg-blue-900/60 text-blue-300" title="角色${label}性别：男">♂ ${label}</span>`;
    return '';
}

function genderBadges(meta) {
    const g = meta.genders || {};
    return genderBadge(g.char_a, 'A') + genderBadge(g.char_b, 'B');
}

function renderList() {
    const box = document.getElementById('script-list');
    if (!SCRIPTS.length) {

// AI 审查 (SSE，逐个)
// =========================================================================

async function runReviewSSE(ids) {
    if (_sseBusy || !ids.length) return;
    const body = {
        ids: ids,
        provider: document.getElementById('gen-provider').value,
        model: document.getElementById('gen-model').value,
    };
    const progress = document.getElementById('review-progress');
    progress.classList.remove('hidden');
    progress.textContent = `开始 AI 审查 ${ids.length} 个脚本...`;
    _sseBusy = true;
    document.getElementById('btn-review-all').disabled = true;
    let done = 0;
    try {
        const resp = await fetch('/api/scripts/review', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body),
        });
        if (!resp.ok) {
            const err = await resp.json().catch(() => ({}));
            throw new Error(err.error || `HTTP ${resp.status}`);
        }
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        while (true) {
            const {done: fin, value} = await reader.read();
            if (fin) break;
            buf += decoder.decode(value, {stream: true});
            let idx;
            while ((idx = buf.indexOf('\n\n')) >= 0) {
                const chunk = buf.slice(0, idx);
                buf = buf.slice(idx + 2);
                if (!chunk.startsWith('data: ')) continue;
                let ev;
                try { ev = JSON.parse(chunk.slice(6)); } catch (e) { continue; }
                if (ev.type === 'progress') {
                    progress.textContent = ev.message;
                } else if (ev.type === 'reviewed') {
                    done++;
                    const i = SCRIPTS.findIndex(s => s.id === ev.data.id);
                    if (i >= 0) SCRIPTS[i] = ev.data;
                    renderList();
                    if (_editingDoc && _editingDoc.id === ev.data.id) openEditor(ev.data.id, true);
                } else if (ev.type === 'error_item') {
                    progress.textContent = `❌ ${ev.data.topic}: ${ev.data.error}`;
                } else if (ev.type === 'done') {
                    progress.textContent = `审查完成: ${ev.data.reviewed}/${ev.data.total}` +
                        (ev.data.failed ? `，失败 ${ev.data.failed}` : '') +
                        (ev.data.stopped ? '（已停止）' : '');
                } else if (ev.type === 'error') {
                    progress.textContent = '审查失败: ' + ev.error;
                }
            }
        }
    } catch (e) {
        progress.textContent = '审查失败: ' + e.message;
    } finally {
        _sseBusy = false;
        document.getElementById('btn-review-all').disabled = false;
        setTimeout(() => progress.classList.add('hidden'), 6000);
        loadScripts();
    }
}

function reviewOne(id) {
    runReviewSSE([id]);
}

function reviewAll() {
    // 全库范围：不受当前筛选影响，避免漏审筛选外的未审查脚本
    fetch('/api/scripts').then(r => r.json()).then(data => {
        const ids = (data.scripts || [])
            .filter(s => !s.reviewed && s.status !== 'used').map(s => s.id);
        if (!ids.length) {
            alert('脚本库中没有未审查的脚本');
            return;
        }
        runReviewSSE(ids);
    });
}

let _fixIssues = [];

async function fixSelected() {
    if (!_editingDoc || _sseBusy) return;
    const selected = [...document.querySelectorAll('.fix-issue-cb')]
        .filter(c => c.checked)
        .map(c => _fixIssues[parseInt(c.dataset.fixIdx)])
        .filter(Boolean);
    if (!selected.length) {
        alert('请先勾选要修复的问题');
        return;
    }
    const reReview = document.getElementById('fix-re-review').checked;
    const btn = document.getElementById('btn-fix');
    const prog = document.getElementById('fix-progress');
    btn.disabled = true;
    prog.classList.remove('hidden');
    prog.textContent = 'AI 修复中...';
    _sseBusy = true;
    try {
        const resp = await fetch('/api/scripts/fix', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                id: _editingDoc.id,
                issues: selected,
                provider: document.getElementById('gen-provider').value,
                model: document.getElementById('gen-model').value,
                re_review: reReview,
            }),
        });
        if (!resp.ok) {
            const err = await resp.json().catch(() => ({}));
            throw new Error(err.error || `HTTP ${resp.status}`);
        }
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        while (true) {
            const {done, value} = await reader.read();
            if (done) break;
            buf += decoder.decode(value, {stream: true});
            let idx;
            while ((idx = buf.indexOf('\n\n')) >= 0) {
                const chunk = buf.slice(0, idx);
                buf = buf.slice(idx + 2);
                if (!chunk.startsWith('data: ')) continue;
                let ev;
                try { ev = JSON.parse(chunk.slice(6)); } catch (e) { continue; }
                if (ev.type === 'progress') {
                    prog.textContent = ev.message;
                } else if (ev.type === 'fixed') {
                    const i = SCRIPTS.findIndex(s => s.id === ev.data.id);
                    if (i >= 0) SCRIPTS[i] = ev.data;
                    renderList();
                } else if (ev.type === 'reviewed') {
                    const i = SCRIPTS.findIndex(s => s.id === ev.data.id);
                    if (i >= 0) SCRIPTS[i] = ev.data;
                    renderList();
                } else if (ev.type === 'done') {
                    const left = ev.data && ev.data.remaining;
                    prog.textContent = left ? `⚠ 修复完成，${left} 个问题多轮修复后仍未解决` : '✅ 修复完成';
                } else if (ev.type === 'error') {
                    prog.textContent = '❌ ' + ev.error;
                }
            }
        }
        // 重载编辑器（显示修复后的脚本 + 新审查结论）
        if (_editingDoc) openEditor(_editingDoc.id, true);
    } catch (e) {
        prog.textContent = '❌ ' + e.message;
    } finally {
        _sseBusy = false;
        btn.disabled = false;
        setTimeout(() => { prog.classList.add('hidden'); loadScripts(); }, 4000);
    }
}

function saveEditor() {
    if (!_editingDoc) return;
    const body = document.getElementById('ed-body');
    const s = _editingDoc.script;
    body.querySelectorAll('[data-field]:not([data-line])').forEach(el => {
        s[el.dataset.field] = el.value;
    });
    body.querySelectorAll('[data-line]').forEach(el => {
        const idx = parseInt(el.dataset.line);
        if (s.dialogue && s.dialogue[idx]) s.dialogue[idx][el.dataset.field] = el.value;
    });
    const patch = {script: s};
    const topicEl = body.querySelector('[data-meta="topic"]');
    if (topicEl) patch.topic = topicEl.value;
    const cefrEl = body.querySelector('[data-meta="cefr"]');
    if (cefrEl) patch.cefr = cefrEl.value;

    const btn = document.getElementById('ed-save');
    fetch('/api/scripts/' + _editingDoc.id, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(patch),
    })
    .then(r => r.json())
    .then(data => {
        if (data.ok) {
            btn.textContent = '✅ 已保存';
            btn.classList.add('bg-green-600');
            setTimeout(() => { btn.textContent = '💾 保存'; btn.classList.remove('bg-green-600'); }, 2000);
            loadScripts();
            // 重开编辑器：显示重算后的本地检查与 stale 标记
            if (_editingDoc) openEditor(_editingDoc.id, true);
        } else {
            alert('保存失败: ' + (data.error || ''));
        }
    });
}

// 后台任务断线恢复：页面刷新后若有批量任务仍在跑，轮询状态直到结束
// =========================================================================
const KIND_LABEL = {generate: '批量生成', review: 'AI 审查', fix: 'AI 修复'};

function checkBatchRecovery() {
    fetch('/api/scripts/batch_status')
        .then(r => r.json())
        .then(d => {
            if (!d || !d.running) return;
            const progress = document.getElementById('review-progress');
            progress.classList.remove('hidden');
            _sseBusy = true;  // 后台任务占用中，禁止再启动新任务
            const timer = setInterval(() => {
                fetch('/api/scripts/batch_status')
                    .then(r => r.json())
                    .then(d2 => {
                        const s = (d2 && d2.snapshot) || {};
                        const label = KIND_LABEL[s.kind] || '批量任务';
                        if (d2 && d2.running) {
                            progress.innerHTML =
                                `⚠ 页面刷新前有「${label}」任务仍在后台进行: ` +
                                `${escapeHtml(String(s.current || ''))} ` +
                                `(${s.done || 0}/${s.total || 0}) ` +
                                `— <button type="button" onclick="stopGenerate()" class="text-red-400 hover:text-red-300 underline">⏹ 停止</button>`;
                        } else {
                            clearInterval(timer);
                            _sseBusy = false;
                            progress.textContent = `✅ 后台「${label}」任务已结束，列表已刷新`;
                            loadScripts();
                            setTimeout(() => progress.classList.add('hidden'), 6000);
                        }
                    })
                    .catch(() => {});
            }, 5000);
        })
        .catch(() => {});
}
